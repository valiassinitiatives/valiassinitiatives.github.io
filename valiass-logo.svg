<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" role="img" aria-labelledby="title desc">
  <title id="title">VALIASS logo</title>
  <desc id="desc">Circular emblem with layered mountain motif and VALIASS text in gold.</desc>
  <defs>
    <linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%">
      <stop offset="0%" stop-color="#2d020d"/>
      <stop offset="60%" stop-color="#7b102c"/>
      <stop offset="100%" stop-color="#5a0a1f"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" x2="100%" y1="0%" y2="0%">
      <stop offset="0%" stop-color="#f4d778"/>
      <stop offset="50%" stop-color="#d8a233"/>
      <stop offset="100%" stop-color="#f4d778"/>
    </linearGradient>
  </defs>

  <circle cx="250" cy="250" r="210" fill="#f7f3ee"/>
  <circle cx="250" cy="250" r="183" fill="#0f1f2c" stroke="url(#goldGrad)" stroke-width="16"/>
  <circle cx="250" cy="250" r="166" fill="url(#bgGrad)" stroke="#d0a947" stroke-width="8"/>

  <path d="M80 320 L170 250 L230 320 Z" fill="#dca229" opacity="0.9"/>
  <path d="M114 320 L200 210 L290 320 Z" fill="#2d6876" opacity="0.95"/>
  <path d="M210 320 L300 202 L390 320 Z" fill="#dca229" opacity="0.9"/>
  <path d="M150 320 L250 178 L350 320 Z" fill="#2d6876" opacity="0.95"/>

  <path d="M70 320 H430 L430 325 L70 325 Z" fill="#1d0a0f"/>
  <path d="M100 320 H400 L400 330 L100 330 Z" fill="#d4a542"/>

  <g fill="#f0d377" stroke="#f0d377" stroke-width="2">
    <circle cx="130" cy="137" r="6"/>
    <circle cx="170" cy="137" r="6"/>
    <circle cx="210" cy="137" r="6"/>
    <circle cx="290" cy="137" r="6"/>
    <circle cx="330" cy="137" r="6"/>
    <circle cx="370" cy="137" r="6"/>
  </g>

  <g>
    <circle cx="130" cy="133" r="7" fill="#201d1a" stroke="#d4a542" stroke-width="2"/>
    <circle cx="370" cy="133" r="7" fill="#201d1a" stroke="#d4a542" stroke-width="2"/>
  </g>

  <g>
    <text x="250" y="270" text-anchor="middle" font-size="78" font-family="Georgia, 'Times New Roman', serif" font-weight="700" fill="#f0d377" letter-spacing="1.5">VALIASS</text>
  </g>

  <g>
    <circle cx="250" cy="360" r="5" fill="#f0d377"/>
    <circle cx="202" cy="360" r="5" fill="#f0d377"/>
    <circle cx="298" cy="360" r="5" fill="#f0d377"/>
  </g>
</svg>
